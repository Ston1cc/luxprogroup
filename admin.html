<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | LUXPRO GROUP</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070707">
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--gold:#d9a63b;--gold2:#f4cf76;--muted:#aaa;--line:rgba(217,166,59,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#fff;font:15px/1.6 'Jost',Arial,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
.container{width:min(1180px,92%);margin:auto}
header{padding:20px 0;border-bottom:1px solid #171717;display:flex;align-items:center;justify-content:space-between}
.logo{height:44px}
.brand{display:flex;align-items:center;gap:12px;font:600 12px/1 'Jost',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:1px solid var(--gold);border-radius:999px;font:600 11px/1 'Jost',sans-serif;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer;background:none;color:var(--gold2);transition:.2s}
.icon-btn{padding:0;width:38px;height:38px;flex:none}
.icon-btn svg{width:16px;height:16px}
.btn:hover{background:var(--gold);color:#050505}
.btn:disabled{opacity:.5;cursor:default}
.primary{background:linear-gradient(135deg,#b67c18,#f2c967);color:#050505;border-color:transparent}
.primary:hover{background:linear-gradient(135deg,#b67c18,#f2c967);color:#050505;opacity:.9}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:380px;background:linear-gradient(160deg,#181209,#0c0c0c);border:1px solid var(--line);border-radius:14px;padding:36px 30px;text-align:center}
.login-box img{height:60px;margin-bottom:18px}
.login-box h1{font:400 26px 'Bodoni Moda',Georgia,serif;margin:0 0 22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;text-align:left}
label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#aaa}
input{background:#101010;color:#fff;border:1px solid #242424;border-radius:10px;padding:13px 14px;outline:none;font-size:16px;width:100%}
input:focus{border-color:var(--gold)}
.error{color:#e77;font-size:13px;margin:10px 0 0;display:none}

#dash{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:24px 0 16px}
.toolbar input[type=search]{flex:1;min-width:180px;background:#101010;color:#fff;border:1px solid #222;border-radius:8px;padding:10px 14px;outline:none;font-size:14px}
.toolbar input[type=search]:focus{border-color:var(--gold)}
.count{color:var(--muted);font-size:12px;white-space:nowrap;letter-spacing:.3px}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}

.table-wrap{overflow-x:auto;padding-bottom:60px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 12px;font:600 10px/1 'Jost',sans-serif;letter-spacing:1px;text-transform:uppercase;color:#777;border-bottom:1px solid #1d1d1d;white-space:nowrap}
tbody tr{border-bottom:1px solid #161616;transition:background .15s}
tbody tr:hover{background:#0d0d0d}
td{padding:13px 12px;vertical-align:top;color:#ccc}
.cell-name{color:#fff;font-weight:600;font-size:13.5px}
.cell-date{color:#666;font-size:11.5px;white-space:nowrap}
td a{color:var(--gold2)}
.cell-msg{display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;cursor:default}
.status-cell{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
select.status{background:#101010;color:#ccc;border:1px solid #242424;border-radius:6px;padding:6px 8px;font:500 12px/1 'Jost',sans-serif}
select.status:focus{border-color:var(--gold)}
select.status option{background:#101010;color:#ddd}
select.status option:checked{background:#1d1608;color:var(--gold2)}
.del-btn{background:none;border:1px solid #2a2a2a;color:#888;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.del-btn:hover{border-color:#a33;color:#e77}
.del-btn.confirm{border-color:#a33;color:#fff;background:#a33;width:auto;padding:0 10px;font:600 10px/1 'Jost',sans-serif;letter-spacing:.5px;text-transform:uppercase}
.del-btn svg{width:14px;height:14px}

@media(max-width:820px){
  thead{display:none}
  table,tbody{display:block;width:100%}
  tbody tr{display:grid;grid-template-columns:1fr auto;column-gap:12px;row-gap:5px;
    grid-template-areas:"name date" "contact contact" "project project" "message message" "status actions";
    padding:14px 2px;border-bottom:1px solid #1a1a1a;align-items:center}
  td{display:block;padding:0;border:0}
  td:nth-child(1){grid-area:name}
  td:nth-child(2){grid-area:contact;font-size:12.5px}
  td:nth-child(3){grid-area:project}
  td:nth-child(4){grid-area:message}
  td:nth-child(5){grid-area:status}
  td:nth-child(6){grid-area:date;justify-self:end}
  td:empty{display:none}
  .cell-date{font-size:11px}
  .cell-msg{max-width:100%;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:italic;color:#999}
  .cell-project{display:inline-block;font-size:11px;color:var(--gold2);background:#151310;border:1px solid #242018;border-radius:5px;padding:3px 8px}
  .cell-actions{grid-area:actions;justify-self:end}
  .status-cell{justify-content:flex-start}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <img src="img/logo.png" alt="LUXPRO GROUP">
    <h1>Admin</h1>
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" required autocomplete="username"></div>
      <div class="field"><label>Parolă</label><input type="password" id="loginPass" required autocomplete="current-password"></div>
      <button class="btn primary" type="submit" style="width:100%" id="loginBtn">Autentificare</button>
      <p class="error" id="loginError">Email sau parolă incorectă.</p>
    </form>
    <a class="btn outline" href="index.html" style="width:100%;margin-top:12px">Înapoi la site</a>
  </div>
</div>

<div id="dash">
  <div class="container">
    <header>
      <div class="brand"><img class="logo" src="img/logo.png" alt="LUXPRO GROUP">Panou leads</div>
      <div style="display:flex;gap:10px">
        <a class="btn icon-btn" href="index.html" title="Înapoi la site" aria-label="Înapoi la site">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 1 0 .708-.708zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/></svg>
        </a>
        <button class="btn" id="logoutBtn">Deconectare</button>
      </div>
    </header>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Caută după nume, telefon sau email...">
      <span class="count" id="count">0 lead-uri</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nume</th><th>Contact</th><th>Proiect</th><th>Mesaj</th><th>Status</th><th>Data</th><th></th></tr></thead>
        <tbody id="leads"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  "https://mdmrnqlqakojxuohxjyr.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kbXJucWxxYWtvanh1b2h4anlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2ODgwMTksImV4cCI6MjEwNDI2NDAxOX0.gQGborrMgBcIVCxwtN_5TvMzD45qqxf6OiXKrjhkPzM"
);

const STATUSES = ["nou","contactat","ofertă trimisă","câștigat","pierdut"];
const STATUS_COLORS = {
  "nou": "#f4cf76",
  "contactat": "#7ab8f5",
  "ofertă trimisă": "#f2b84b",
  "câștigat": "#6fcf7e",
  "pierdut": "#e57373"
};
const TRASH_ICON = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5ZM11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H2.506a.58.58 0 0 0-.01 0H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1h-.995a.59.59 0 0 0-.01 0H11Zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5h9.916Zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm3.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47Z"/></svg>';
let allLeads = [];

function fmtDate(iso){
  return new Date(iso).toLocaleString("ro-RO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}

function renderLeads(list){
  const box = document.getElementById("leads");
  document.getElementById("count").textContent = list.length + (list.length===1?" lead":" lead-uri");
  if(!list.length){ box.innerHTML = '<tr><td colspan="7" class="empty">Niciun lead găsit.</td></tr>'; return; }
  box.innerHTML = list.map(l => {
    const status = l.status || "nou";
    const color = STATUS_COLORS[status] || "#888";
    return `
    <tr data-id="${l.id}">
      <td><span class="cell-name">${escapeHtml(l.name)}</span></td>
      <td>
        <a href="tel:${escapeHtml(l.phone)}">${escapeHtml(l.phone)}</a>
        ${l.email ? ` · <a href="mailto:${escapeHtml(l.email)}">${escapeHtml(l.email)}</a>` : ""}
      </td>
      <td>${l.project_type ? `<span class="cell-project">${escapeHtml(l.project_type)}</span>` : ""}</td>
      <td>${l.message ? `<span class="cell-msg" title="${escapeHtml(l.message)}">${escapeHtml(l.message)}</span>` : ""}</td>
      <td>
        <div class="status-cell">
          <span class="dot" style="background:${color}"></span>
          <select class="status" data-id="${l.id}">
            ${STATUSES.map(s => `<option value="${s}" ${s===status?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
      </td>
      <td><span class="cell-date">${fmtDate(l.created_at)}</span></td>
      <td class="cell-actions"><button class="del-btn" data-id="${l.id}" title="Șterge">${TRASH_ICON}</button></td>
    </tr>`;
  }).join("");

  box.querySelectorAll(".status").forEach(sel => {
    sel.addEventListener("change", async (e) => {
      const id = e.target.dataset.id, status = e.target.value;
      const { error } = await sb.from("leads").update({ status }).eq("id", id);
      if(error){ console.error(error); return; }
      const lead = allLeads.find(x => x.id === id);
      if(lead) lead.status = status;
      const dot = e.target.closest(".status-cell").querySelector(".dot");
      dot.style.background = STATUS_COLORS[status] || "#888";
    });
  });

  box.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const el = e.currentTarget, id = el.dataset.id;
      if(!el.classList.contains("confirm")){
        el.classList.add("confirm");
        el.innerHTML = "Confirmă";
        el.dataset.timer = setTimeout(() => {
          el.classList.remove("confirm");
          el.innerHTML = TRASH_ICON;
        }, 3000);
        return;
      }
      clearTimeout(el.dataset.timer);
      const { error } = await sb.from("leads").delete().eq("id", id);
      if(error){ console.error(error); return; }
      allLeads = allLeads.filter(x => x.id !== id);
      applyFilter();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function applyFilter(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  if(!q){ renderLeads(allLeads); return; }
  renderLeads(allLeads.filter(l =>
    (l.name||"").toLowerCase().includes(q) ||
    (l.phone||"").toLowerCase().includes(q) ||
    (l.email||"").toLowerCase().includes(q)
  ));
}
document.getElementById("search").addEventListener("input", applyFilter);

async function loadLeads(){
  const { data, error } = await sb.from("leads").select("*").order("created_at", { ascending: false });
  if(error){ console.error(error); return; }
  allLeads = data;
  applyFilter();
}

function showDash(){
  document.getElementById("login").style.display = "none";
  document.getElementById("dash").style.display = "block";
  loadLeads();
  sb.channel("leads-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "leads" }, () => loadLeads())
    .subscribe();
}

function showLogin(){
  document.getElementById("dash").style.display = "none";
  document.getElementById("login").style.display = "flex";
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn"), err = document.getElementById("loginError");
  btn.disabled = true; err.style.display = "none";
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("loginEmail").value,
    password: document.getElementById("loginPass").value
  });
  btn.disabled = false;
  if(error){ err.style.display = "block"; return; }
  showDash();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  showLogin();
});

sb.auth.getSession().then(({ data: { session } }) => {
  if(session) showDash(); else showLogin();
});
</script>
</body>
</html>
